---
- name: Debug scenario parameters
  debug:
    msg: |
      Scenario Parameters: {{ s }}

- name: Name log directory
  set_fact:
    log_dir: "/tmp/bg_logs/protocol=ICMP/ue_count={{ ue_count }}/start_time={{ ansible_date_time.epoch }}"

- name: Create local log directory
  ansible.builtin.file:
    path: "{{ log_dir }}/"
    state: directory

- name: Save scenario variables to params.json
  copy:
    content: "{{ s | to_nice_json }}"
    dest: "{{ log_dir }}/params.json"

- name: Start iPerf background traffic
  shell: |
    ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@{{ current_ue }} \
    "nohup iperf3 -p {{ iperf_port }} -B {{ ue_ip }} -c {{ target_server }} -t {{ iperf_duration }} {{ s.iperf_args }} > {{ log_dir }}/iperf.json 2>&1 &"
  when: s.bg_traffic != "None"

- name: Run ping tests {{ current_ue }} via faraday
  shell: |
    ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@{{ current_ue }} \
    "mkdir -p {{ log_dir }} &&
    (nohup /usr/local/bin/snmp_stats.sh {{ ping_duration }} {{ log_dir }}/snmp.log > /dev/null 2>&1 &) &&
    ping {{ target_server }} -I {{ ue_ip }} -4 -n -O -D -w {{ ping_duration }} {{ s.ping_args }} > {{ log_dir }}/ping.log 2>&1 &&
    sleep {{ sleep }} &&
    pkill iperf3"
  ignore_errors: "{{ ignore_task_errors | default(false) }}"
  when: ue_ip is defined and ue_ip != ""


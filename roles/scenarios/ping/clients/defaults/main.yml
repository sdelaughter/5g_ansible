---
duration: "{{ ping_duration | default(30) }}"
sleep: "{{ ping_sleep | default(5) }}"
async_stagger: 0
do_individual_tests: true
do_simultaneous_tests: true

ping_scenarios:
  - {packet_size: 64, ttl: 64, ping_interval: 1, extra_args: "-s 56 -t 64 -i 1"}
  - {packet_size: 64, ttl: 64, ping_interval: 0.1, extra_args: "-s 56 -t 64 -i 0.1"}
  - {packet_size: 64, ttl: 64, ping_interval: 0.01, extra_args: "-s 56 -t 64 -i 0.01"}
  # - {packet_size: 1000, extra_args: "-s 992"} # 8 bytes of header data
